name: Weekly portfolio drift audit

# Audits the configured portfolio every Monday at 09:00 UTC. Uploads the
# drift report as a workflow artifact. If drift is detected, opens (or updates)
# a GitHub Issue with the report summary so it can be triaged.

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      adapter:
        description: 'Adapter to use (beacon | file)'
        required: false
        default: 'beacon'
      limit:
        description: 'Limit to N projects (for smoke tests)'
        required: false
        default: ''

jobs:
  audit:
    name: Drift audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      BEACON_API_URL: ${{ secrets.BEACON_API_URL || 'https://beacon.danhle.net' }}
      BEACON_JWT: ${{ secrets.BEACON_JWT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DRIFT_ADAPTER: ${{ github.event.inputs.adapter || 'beacon' }}
      DRIFT_LIMIT: ${{ github.event.inputs.limit }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Run drift audit
        id: audit
        run: |
          drift-agent
          # Surface the latest report path + drift count to subsequent steps
          report=$(ls -t output/drift_*.md | head -1)
          json=$(ls -t output/drift_*.json | head -1)
          echo "report=$report" >> "$GITHUB_OUTPUT"
          echo "json=$json" >> "$GITHUB_OUTPUT"
          drift_count=$(python -c "import json,sys; d=json.load(open('$json')); print(sum(1 for r in d['reports'] if r.get('description_suggestion') or r.get('outcome_suggestion') or r.get('tech_stack_additions') or r.get('tech_stack_removals') or r.get('canonical_url') or r.get('is_stale')))")
          echo "drift_count=$drift_count" >> "$GITHUB_OUTPUT"
          echo "Found $drift_count projects with drift"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: drift-report-${{ github.run_id }}
          path: |
            output/drift_*.md
            output/drift_*.json

      - name: Open issue if drift was found
        if: steps.audit.outputs.drift_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('${{ steps.audit.outputs.report }}', 'utf-8');
            const driftCount = '${{ steps.audit.outputs.drift_count }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            const title = `Portfolio drift detected (${driftCount} project${driftCount === '1' ? '' : 's'}) — ${today}`;
            const body = [
              `Weekly drift audit found **${driftCount} project${driftCount === '1' ? '' : 's'}** with drift.`,
              ``,
              `[Workflow run](${runUrl}) · [Artifact: drift-report-${context.runId}](${runUrl})`,
              ``,
              `---`,
              ``,
              report,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['drift-audit'],
            });
